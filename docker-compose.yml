x-backend-env-file: &backend-env-file
  - ./backend/.env

x-frontend-env-file: &frontend-env-file
  - ./frontend/.env

services:
  postgres:
    image: postgres:17-alpine
    container_name: dorix-postgres
    env_file: *backend-env-file
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dorix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-init:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: dorix-backend-init
    working_dir: /var/www/html/backend
    volumes:
      - ./backend:/var/www/html/backend
      - backend_vendor:/var/www/html/backend/vendor
      - composer_cache:/tmp/composer-cache
    env_file: *backend-env-file
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-lc", "/usr/local/bin/backend-init"]
    restart: "no"

  php-fpm:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: dorix-php-fpm
    working_dir: /var/www/html/backend
    volumes:
      - ./backend:/var/www/html/backend
      - backend_vendor:/var/www/html/backend/vendor
      - composer_cache:/tmp/composer-cache
    env_file: *backend-env-file
    depends_on:
      backend-init:
        condition: service_completed_successfully
    command: ["php-fpm"]

  queue-worker:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: dorix-queue-worker
    working_dir: /var/www/html/backend
    volumes:
      - ./backend:/var/www/html/backend
      - backend_vendor:/var/www/html/backend/vendor
      - composer_cache:/tmp/composer-cache
    env_file: *backend-env-file
    depends_on:
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--tries=3",
        "--backoff=5",
        "--timeout=120"
      ]

  horizon:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: dorix-horizon
    working_dir: /var/www/html/backend
    volumes:
      - ./backend:/var/www/html/backend
      - backend_vendor:/var/www/html/backend/vendor
      - composer_cache:/tmp/composer-cache
    env_file: *backend-env-file
    depends_on:
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["php", "artisan", "horizon"]

  nginx:
    image: nginx:1.27-alpine
    container_name: dorix-nginx
    depends_on:
      php-fpm:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html/backend:ro
      - backend_vendor:/var/www/html/backend/vendor:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: dorix-frontend
    working_dir: /var/www/html/frontend
    depends_on:
      nginx:
        condition: service_started
    env_file: *frontend-env-file
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/var/www/html/frontend
      - frontend_node_modules:/var/www/html/frontend/node_modules
    command: ["sh", "-lc", "/usr/local/bin/frontend-start"]

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:
  composer_cache:
